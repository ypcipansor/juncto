[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6.15", features = ["csr"] }
leptos_router = { version = "0.6.15", features = ["csr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.12.12", features = ["json"] }
shared = { path = "../shared" }
gloo-net = "0.6.0"
wasm-bindgen = "0.2.122"
console_error_panic_hook = "0.1.7"
urlencoding = "2.1.3"
js-sys = "0.3.99"
web-sys = { version = "0.3.99", features = ["WebSocket", "MessageEvent", "Location", "Window", "MouseEvent", "HtmlCanvasElement", "CanvasRenderingContext2d", "Navigator", "MediaDevices", "MediaDeviceInfo", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "HtmlVideoElement", "HtmlMediaElement", "Element", "MediaDeviceKind", "FileReader", "File", "FileList", "Blob", "HtmlInputElement", "Event", "EventTarget", "KeyboardEvent", "Document", "HtmlElement", "Node", "AudioContext", "AnalyserNode", "AudioNode", "MediaStreamAudioSourceNode", "Clipboard", "RtcPeerConnection", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcIceCandidate", "RtcIceCandidateInit", "RtcPeerConnectionIceEvent", "RtcTrackEvent", "RtcRtpSender", "RtcSdpType", "RtcConfiguration", "RtcIceServer", "RtcOfferOptions", "RtcAnswerOptions", "RtcSignalingState", "MediaTrackSettings", "CustomEvent", "CustomEventInit", "DynamicsCompressorNode", "AudioParam", "Storage", "MediaRecorder", "MediaRecorderOptions", "BlobEvent", "BlobPropertyBag", "HtmlAnchorElement", "Url", "RecordingState", "DomRect"] }
gloo-timers = "0.4.0"
wasm-bindgen-futures = "0.4.72"

[lib]
crate-type = ["cdylib", "rlib"]
